name: Automated Release & NPM Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Bump Version & Publish to NPM
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve Version to Publish
        id: resolve
        run: |
          PUBLISHED_VER=$(npm view agent-as-a-tutor version 2>/dev/null || echo "0.0.0")
          LOCAL_VER=$(node -p "require('./package.json').version")

          echo "Published on NPM: $PUBLISHED_VER"
          echo "Local package.json: $LOCAL_VER"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$LOCAL_VER" = "$PUBLISHED_VER" ]; then
            echo "Local version matches published version. Determining bump..."
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            BUMP_TYPE=$(node -e "
              const msg = process.env.COMMIT_MSG || '';
              if (/(BREAKING CHANGE|!:)|\bfeat!|\bfix!/i.test(msg)) {
                console.log('major');
              } else if (/^feat(\(.*\))?:/im.test(msg)) {
                console.log('minor');
              } else {
                console.log('patch');
              }
            ")
            echo "Bumping $BUMP_TYPE..."
            NEW_VER_RAW=$(npm version $BUMP_TYPE --no-git-tag-version)
            NEW_VER="${NEW_VER_RAW#v}"
            git commit -am "chore(release): v${NEW_VER} [skip ci]"
            git tag "v${NEW_VER}"
            echo "target_version=${NEW_VER}" >> $GITHUB_OUTPUT
            echo "push_commit=true" >> $GITHUB_OUTPUT
          else
            echo "Local version ($LOCAL_VER) is unreleased. Publishing current version..."
            echo "target_version=${LOCAL_VER}" >> $GITHUB_OUTPUT
            echo "push_commit=false" >> $GITHUB_OUTPUT
          fi
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Publish to NPM
        run: |
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push Git Commit & Tag to GitHub
        if: steps.resolve.outputs.push_commit == 'true'
        run: |
          git push origin main --follow-tags

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.resolve.outputs.target_version }}
          name: v${{ steps.resolve.outputs.target_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
